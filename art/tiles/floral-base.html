<!doctype html><html><head><meta charset="utf-8"><title>Tile print</title><style>html,body{margin:0;background:#f5f2e9}canvas{display:block;width:100%;height:auto;max-width:1500px;margin:auto}</style></head><body><canvas id="print" width="1500" height="1125"></canvas><script>
// Four independently printed plates; all coordinates derive from the source tile lattice.
// No image assets or dependencies. Fixed seed makes the output reproducible.
'use strict';
const W=1500,H=1125,S=1,seed=731921;
const canvas=document.getElementById('print'),ctx=canvas.getContext('2d');
function hash(x,y,s=0){let v=Math.imul(x+seed+s,374761393)^Math.imul(y+17,668265263);v=Math.imul(v^(v>>>13),1274126177);return ((v^(v>>>16))>>>0)/4294967295}
function noise(x,y,scale,s){x/=scale;y/=scale;let a=Math.floor(x),b=Math.floor(y),u=x-a,v=y-b;u=u*u*(3-2*u);v=v*v*(3-2*v);return (hash(a,b,s)*(1-u)+hash(a+1,b,s)*u)*(1-v)+(hash(a,b+1,s)*(1-u)+hash(a+1,b+1,s)*u)*v}
const paper=new Float32Array(W*H),out=ctx.createImageData(W,H);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x;let weave=(Math.sin(x*2.1)+Math.sin(y*2.22))*.65;let p=(hash(x,y,52)-.5)*5+weave+(noise(x,y,24,2)-.5)*3;paper[i]=p;[246,243,234].forEach((c,k)=>out.data[i*4+k]=c+p);out.data[i*4+3]=255;}
ctx.putImageData(out,0,0);
const plates=Array.from({length:4},()=>{let c=document.createElement('canvas');c.width=W;c.height=H;return c});
const pc=plates.map(c=>c.getContext('2d'));pc.forEach(c=>{c.scale(S,S);c.fillStyle='#fff';c.strokeStyle='#fff';c.lineJoin='round';c.lineCap='round'});
// Orthographic top-down reconstruction of the floral pavement.
// One rosette repeats every two component tiles, with red corner inserts.
function project(u,v){return [u*230+60,v*230+85]}
function path(c,pts,close=true){c.beginPath();pts.forEach((p,j)=>{let q=project(...p);j?c.lineTo(...q):c.moveTo(...q)});if(close)c.closePath()}
function shape(c,pts){path(c,pts);c.fill()}
// Four circular lobes joined by short reentrant corners, repeated consistently.
function flower(u,v,scale){let pts=[];const d=.166*scale,r=.264*scale;for(let l=0;l<4;l++){let angle=l*Math.PI/2;for(let n=0;n<=28;n++){let t=angle-Math.PI/2+n*Math.PI/28;pts.push([u+d*Math.cos(angle)+r*Math.cos(t),v+d*Math.sin(angle)+r*Math.sin(t)])}}return pts}
pc[0].fillRect(0,0,W,H);
// Motif plates omitted: only the green base plate and the tile joints print.
// Tile joints run through the centre of each four-tile rosette.
for(let p=0;p<4;p++){
 pc[p].globalCompositeOperation='destination-out';pc[p].globalAlpha=.62;pc[p].lineWidth=.75;
 for(let u=-14;u<15;u+=.5){path(pc[p],[[u,-3],[u,22]],false);pc[p].stroke()}
 for(let v=-3;v<22;v+=.5){path(pc[p],[[-14,v],[15,v]],false);pc[p].stroke()}
 pc[p].globalCompositeOperation='source-over';pc[p].globalAlpha=1;
}
// Each mask is resampled with local edge displacement, printed through pressure,
// dry-transfer, roller, paper tooth and individual pinhole fields, then multiplied.
const colors=[[57,64,62],[177,150,104],[115,64,58],[139,75,64]];
const offsets=[[.3,-.4],[-1.4,.8],[1.5,-.6],[0,0]];
for(let p=0;p<4;p++){
const mask=pc[p].getImageData(0,0,W,H).data;let ink=ctx.createImageData(W,H),d=ink.data;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
let i=y*W+x,warpX=(noise(x,y,23,201+p)-.5)*2.8,warpY=(noise(x,y,29,211+p)-.5)*2.8;
let sx=Math.max(0,Math.min(W-1,Math.round(x-offsets[p][0]+warpX))),sy=Math.max(0,Math.min(H-1,Math.round(y-offsets[p][1]+warpY)));
let m=mask[(sy*W+sx)*4+3]/255;
if(!m)continue;
let pressure=noise(x,y,220,300+p),dry=noise(x,y,17,400+p),small=noise(x,y,4.4,450+p),roller=noise(x*.12,y,22,500+p);
let coverage=.82+.24*(pressure-.5)+.10*(roller-.5)+.18*(dry-.5)+.20*(small-.5);
// Sparse correlated dry patches; no large white damage areas.
coverage-=Math.max(0,.30-dry)*.48;
let fleck=hash(x,y,610+p),tooth=paper[i];
coverage+=(tooth/12)*.18;
if(fleck<.010+Math.max(0,.40-dry)*.04)coverage*=.30;
else if(fleck<.17)coverage*=.66;
coverage*=p===0?1.10:1;
let alpha=Math.max(0,Math.min(.96,coverage))*m;
d[i*4]=colors[p][0];d[i*4+1]=colors[p][1];d[i*4+2]=colors[p][2];d[i*4+3]=Math.round(alpha*255);
}
let plate=document.createElement('canvas');plate.width=W;plate.height=H;plate.getContext('2d').putImageData(ink,0,0);
ctx.globalCompositeOperation='multiply';ctx.drawImage(plate,0,0);
}
// Thin paper fibres remain visible within and between inks.
ctx.globalCompositeOperation='multiply';ctx.strokeStyle='rgba(120,108,84,0.075)';ctx.lineWidth=.55;
for(let k=0;k<16000;k++){let x=hash(k,0,901)*W,y=hash(k,1,902)*H,len=1+hash(k,2,903)*5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+len*.35,y+len);ctx.stroke()}
ctx.globalCompositeOperation='source-over';window.renderComplete=true;
</script></body></html>
